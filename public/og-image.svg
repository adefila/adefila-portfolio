<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" fill="none">
  <defs>
    <style>
      @import url('https://fonts.googleapis.com/css2?family=Poppins:wght@400;700&amp;family=Inter:wght@400;500;600;700&amp;display=swap');
    </style>
  </defs>

  <!-- ── LEFT PANEL (dark) ── -->
  <rect width="780" height="630" fill="#0f0f0f"/>

  <!-- Label: SAMUEL ADEFILA -->
  <text x="64" y="92" font-family="Inter, Arial, sans-serif" font-weight="700"
        font-size="13" letter-spacing="4" fill="#6d28d9">SAMUEL ADEFILA</text>

  <!-- Headline -->
  <text x="64" y="196" font-family="Poppins, Arial Black, sans-serif" font-weight="700"
        font-size="88" letter-spacing="-4" fill="#ffffff">DESIGN &amp;</text>
  <text x="64" y="296" font-family="Poppins, Arial Black, sans-serif" font-weight="700"
        font-size="88" letter-spacing="-4" fill="#ffffff">DEVELOPMENT</text>
  <text x="64" y="396" font-family="Poppins, Arial Black, sans-serif" font-weight="700"
        font-size="88" letter-spacing="-4" fill="rgba(255,255,255,0.18)">THAT CONVERTS.</text>

  <!-- Sub: tools -->
  <text x="64" y="530" font-family="Inter, Arial, sans-serif" font-weight="500"
        font-size="14" letter-spacing="3" fill="rgba(255,255,255,0.35)">FRAMER · SHOPIFY · WEBFLOW</text>

  <!-- ── RIGHT PANEL (light) ── -->
  <rect x="780" width="420" height="630" fill="#f7f7f7"/>

  <!-- Top: purple accent bar -->
  <rect x="780" width="420" height="3" fill="#6d28d9"/>

  <!-- Stats 2×2 grid -->
  <!-- Stat 1: 50+ -->
  <text x="836" y="160" font-family="Poppins, Arial Black, sans-serif" font-weight="700"
        font-size="68" letter-spacing="-3" fill="#0f0f0f">50+</text>
  <text x="836" y="188" font-family="Inter, Arial, sans-serif" font-weight="500"
        font-size="12" letter-spacing="1.5" fill="#9ca3af">PROJECTS SHIPPED</text>

  <!-- Stat 2: 14 -->
  <text x="836" y="296" font-family="Poppins, Arial Black, sans-serif" font-weight="700"
        font-size="68" letter-spacing="-3" fill="#0f0f0f">14</text>
  <text x="836" y="324" font-family="Inter, Arial, sans-serif" font-weight="500"
        font-size="12" letter-spacing="1.5" fill="#9ca3af">DAYS AVG. LAUNCH</text>

  <!-- Stat 3: 5+ -->
  <text x="836" y="428" font-family="Poppins, Arial Black, sans-serif" font-weight="700"
        font-size="68" letter-spacing="-3" fill="#0f0f0f">5+</text>
  <text x="836" y="456" font-family="Inter, Arial, sans-serif" font-weight="500"
        font-size="12" letter-spacing="1.5" fill="#9ca3af">YEARS BUILDING</text>

  <!-- Bottom role -->
  <line x1="836" y1="540" x2="1150" y2="540" stroke="rgba(0,0,0,0.08)" stroke-width="1"/>
  <text x="836" y="572" font-family="Inter, Arial, sans-serif" font-weight="600"
        font-size="12" letter-spacing="2" fill="#0f0f0f">FRAMER DEVELOPER &amp; UI/UX DESIGNER</text>

  <!-- Dividers between stats -->
  <line x1="836" y1="208" x2="1150" y2="208" stroke="rgba(0,0,0,0.07)" stroke-width="1"/>
  <line x1="836" y1="344" x2="1150" y2="344" stroke="rgba(0,0,0,0.07)" stroke-width="1"/>
  <line x1="836" y1="472" x2="1150" y2="472" stroke="rgba(0,0,0,0.07)" stroke-width="1"/>
</svg>
