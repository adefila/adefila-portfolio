<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 260 56" fill="none">
  <defs>
    <style>
      @import url('https://fonts.googleapis.com/css2?family=Poppins:wght@700&amp;display=swap');
    </style>
  </defs>

  <!-- Big initials: S (purple) A (dark) -->
  <text x="0" y="48" font-family="Poppins, Arial Black, sans-serif" font-weight="700"
        font-size="52" letter-spacing="-3" fill="#6d28d9">S</text>
  <text x="31" y="48" font-family="Poppins, Arial Black, sans-serif" font-weight="700"
        font-size="52" letter-spacing="-3" fill="#0f0f0f">A</text>

  <!-- Vertical divider -->
  <line x1="78" y1="8" x2="78" y2="48" stroke="rgba(0,0,0,0.15)" stroke-width="1.5"/>

  <!-- Name stack -->
  <text x="90" y="26" font-family="Poppins, Arial Black, sans-serif" font-weight="700"
        font-size="15" letter-spacing="1.5" fill="#0f0f0f">SAMUEL</text>
  <text x="90" y="44" font-family="Poppins, Arial Black, sans-serif" font-weight="700"
        font-size="15" letter-spacing="1.5" fill="#0f0f0f">ADEFILA</text>
</svg>
